<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Utah Civic Compact</title>
  <script>
    // base_url is utahciviccompact.org, so Decap accepts same-origin messages.
    // No origin spoofing needed — relay delivers token from same origin.
    try { localStorage.removeItem('decap-auth'); } catch(e) {}

    var _relayed = false;
    function relay(msg) {
      if (_relayed || !msg || !msg.startsWith('authorization:')) return;
      _relayed = true;
      try { localStorage.removeItem('decap-auth'); } catch(e) {}
      window.postMessage(msg, window.location.origin);
    }
    try {
      new BroadcastChannel('decap-auth').onmessage = function(e) { relay(e.data); };
    } catch(e) {}
    var _poll = setInterval(function() {
      try {
        var msg = localStorage.getItem('decap-auth');
        if (msg) { clearInterval(_poll); relay(msg); }
      } catch(e) { clearInterval(_poll); }
    }, 200);
  </script>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
