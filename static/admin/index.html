<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Utah Civic Compact</title>
  <script>
    // callback.html (same origin) sends postMessage to window.opener here.
    // Decap checks event.origin === base_url (workers.dev), but our message
    // arrives from utahciviccompact.org (same origin). The monkey-patch below
    // intercepts Decap's addEventListener calls and rewrites the origin check
    // so it accepts our same-origin relay.
    var AUTH_ORIGIN = 'https://uccsite-auth.cothv.workers.dev';
    var _origAEL = window.addEventListener.bind(window);
    window.addEventListener = function(type, handler, opts) {
      if (type !== 'message') return _origAEL(type, handler, opts);
      return _origAEL(type, function(e) {
        if (typeof e.data === 'string' &&
            e.data.startsWith('authorization:') &&
            e.origin === window.location.origin) {
          handler.call(this, new MessageEvent('message', {
            data: e.data,
            origin: AUTH_ORIGIN,
          }));
        } else {
          handler.call(this, e);
        }
      }, opts);
    };
  </script>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
