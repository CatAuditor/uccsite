<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Utah Civic Compact</title>
  <script>
    var AUTH_ORIGIN = 'https://uccsite-auth.cothv.workers.dev';
    console.log('[PATCH] Installing prototype-level patch');

    // Patch EventTarget.prototype so we intercept ALL addEventListener calls,
    // including ones from bundled code that captures the native reference.
    var _origAEL = EventTarget.prototype.addEventListener;
    EventTarget.prototype.addEventListener = function(type, handler, opts) {
      if (type === 'message' && this === window) {
        console.log('[PATCH] Wrapping window message listener (prototype)');
        return _origAEL.call(this, type, function(e) {
          if (typeof e.data === 'string' &&
              e.data.startsWith('authorization:') &&
              e.origin === window.location.origin) {
            console.log('[PATCH] Intercepted auth message, spoofing origin');
            handler.call(this, new MessageEvent('message', {
              data: e.data,
              origin: AUTH_ORIGIN,
            }));
          } else {
            handler.call(this, e);
          }
        }, opts);
      }
      return _origAEL.call(this, type, handler, opts);
    };

    // Also keep window.addEventListener patched for good measure
    window.addEventListener = EventTarget.prototype.addEventListener.bind(window);

    // Reset stale token on page load
    try { localStorage.removeItem('decap-auth'); } catch(e) {}

    var _relayed = false;
    function relay(msg) {
      console.log('[RELAY] Called, already relayed:', _relayed);
      if (_relayed || !msg || !msg.startsWith('authorization:')) return;
      _relayed = true;
      console.log('[RELAY] Firing window.postMessage');
      try { localStorage.removeItem('decap-auth'); } catch(e) {}
      window.postMessage(msg, window.location.origin);
    }
    try {
      new BroadcastChannel('decap-auth').onmessage = function(e) {
        console.log('[BC] BroadcastChannel received token');
        relay(e.data);
      };
    } catch(e) {}
    var _poll = setInterval(function() {
      try {
        var msg = localStorage.getItem('decap-auth');
        if (msg) {
          console.log('[POLL] Found token in localStorage');
          clearInterval(_poll);
          relay(msg);
        }
      } catch(e) { clearInterval(_poll); }
    }, 200);
  </script>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
