<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Utah Civic Compact</title>
  <script>
    var AUTH_ORIGIN = 'https://uccsite-auth.cothv.workers.dev';

    // Decap checks event.origin === base_url. Our relay sends from same-origin
    // (utahciviccompact.org), so we intercept Decap's message listeners and
    // rewrite the origin before passing the event through.
    var _origAEL = window.addEventListener.bind(window);
    window.addEventListener = function(type, handler, opts) {
      if (type !== 'message') return _origAEL(type, handler, opts);
      return _origAEL(type, function(e) {
        if (typeof e.data === 'string' &&
            e.data.startsWith('authorization:') &&
            e.origin === window.location.origin) {
          handler.call(this, new MessageEvent('message', {
            data: e.data,
            origin: AUTH_ORIGIN,
          }));
        } else {
          handler.call(this, e);
        }
      }, opts);
    };

    // Receive token from callback.html via BroadcastChannel or localStorage.
    // Guard prevents double-fire if both channels deliver.
    var _relayed = false;
    function relay(msg) {
      if (_relayed || !msg || !msg.startsWith('authorization:')) return;
      _relayed = true;
      try { localStorage.removeItem('decap-auth'); } catch(e) {}
      window.postMessage(msg, window.location.origin);
    }
    try {
      new BroadcastChannel('decap-auth').onmessage = function(e) { relay(e.data); };
    } catch(e) {}
    var _poll = setInterval(function() {
      try {
        var msg = localStorage.getItem('decap-auth');
        if (msg) { clearInterval(_poll); relay(msg); }
      } catch(e) { clearInterval(_poll); }
    }, 200);
  </script>
</head>
<body>
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
