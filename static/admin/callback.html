<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  var msg = decodeURIComponent(location.hash.slice(1));
  if (msg) {
    // BroadcastChannel works without window.opener (Safari-safe)
    try { new BroadcastChannel('decap-auth').postMessage(msg); } catch(e) {}
    // localStorage fallback for older Safari
    localStorage.setItem('decap-auth', msg);
  }
  setTimeout(function() { window.close(); }, 200);
</script>
</body>
</html>
