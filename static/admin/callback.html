<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  var msg = decodeURIComponent(location.hash.slice(1));
  if (msg && window.opener) {
    window.opener.postMessage(msg, window.location.origin);
  }
  setTimeout(function() { window.close(); }, 1000);
</script>
</body>
</html>
