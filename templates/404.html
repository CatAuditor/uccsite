<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | {{orgName}}</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* .hero-ctas is a per-page pattern (alpr, how-did-this-happen) — not in styles.css */
    .hero-ctas { display: flex; justify-content: center; margin: 32px auto 8px; }
  </style>
</head>
<body>

{{> header}}

  <div class="subpage-hero">
    <div class="section-label">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="hero-ctas">
      <a href="/" class="btn btn-primary">Back to the homepage</a>
    </div>
  </div>

{{> footer}}

  <script src="/js/main.js"></script>
</body>
</html>
