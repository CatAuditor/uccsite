<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team &amp; Bios | Utah Civic Compact</title>
  <meta name="description" content="Meet the team behind Utah Civic Compact — the people working to defend the agreement between Utah communities and their government." />
  <link rel="canonical" href="https://utahciviccompact.org/team" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://utahciviccompact.org/team" />
  <meta property="og:title" content="Team &amp; Bios | Utah Civic Compact" />
  <meta property="og:description" content="Meet the team behind Utah Civic Compact — the people working to defend the agreement between Utah communities and their government." />
  <meta property="og:image" content="https://utahciviccompact.org/UCC.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Team &amp; Bios | Utah Civic Compact" />
  <meta name="twitter:description" content="Meet the team behind Utah Civic Compact — the people working to defend the agreement between Utah communities and their government." />
  <meta name="twitter:image" content="https://utahciviccompact.org/UCC.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/colors.css" />
  <link rel="stylesheet" href="/css/pages/team.css" />
</head>
<body>

  <!-- NAVIGATION -->
{{> header}}

  <div class="subpage-hero">
    <div class="section-label">About Us</div>
    <h1>Team &amp; Bios</h1>
    <p>The people working to defend the compact between Utah communities and their government.</p>
  </div>

  <div class="team-section">
    <div class="inner">

      {{#members}}
      <div class="bio-card">
        <div class="bio-photo has-photo">
          <img src="{{photo}}" alt="{{name}}" width="160" height="160" />
        </div>
        <div class="bio-content">
          <h2 class="bio-name">{{name}}</h2>
          <div class="bio-title">{{title}}</div>
          <div class="bio-text">
            {{{bio}}}
          </div>
        </div>
      </div>
      {{/members}}

    </div>
  </div>

  <!-- FOOTER -->
{{> footer}}

  <script src="/js/main.js"></script>
</body>
</html>
