<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy Positions | Utah Civic Compact</title>
  <meta name="description" content="Where Utah Civic Compact stands on redistricting, ballot access, government transparency, local governance, ethics, civic education, and data centers." />
  <link rel="canonical" href="https://utahciviccompact.org/issues" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://utahciviccompact.org/issues" />
  <meta property="og:title" content="Policy Positions | Utah Civic Compact" />
  <meta property="og:description" content="Where Utah Civic Compact stands on redistricting, ballot access, government transparency, local governance, ethics, civic education, and data centers." />
  <meta property="og:image" content="https://utahciviccompact.org/UCC.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Policy Positions | Utah Civic Compact" />
  <meta name="twitter:description" content="Where Utah Civic Compact stands on the issues that determine whether Utahns govern themselves or are governed at." />
  <meta name="twitter:image" content="https://utahciviccompact.org/UCC.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/colors.css" />
  <link rel="stylesheet" href="/css/pages/issues.css" />
</head>
<body>

  <!-- NAVIGATION -->
{{> header}}

  <div class="subpage-hero">
    <div class="section-label">Where We Stand</div>
    <h1>Policy Positions</h1>
    <p>Where we stand, and why — on the issues that determine whether Utahns govern themselves or are governed at.</p>
  </div>

  <div class="issues-page-section">
    <div class="issues-page-inner">

      {{#issues}}
      <article class="issue-article" id="{{slug}}">
        <div class="issue-article-head">
          <span class="issue-num">{{num}}</span>
          <h2 class="issue-title">{{title}}</h2>
        </div>
        <p class="issue-epigraph">{{epigraph}}</p>
        <div class="issue-byline">By {{author}}</div>
        <div class="issue-body">{{{body}}}</div>
      </article>
      {{/issues}}

    </div>
  </div>

  <!-- FOOTER -->
{{> footer}}

  <script src="/js/main.js"></script>
</body>
</html>
