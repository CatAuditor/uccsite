<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statements | Utah Civic Compact</title>
  <meta name="description" content="Official statements from Utah Civic Compact on government transparency, consent, and civic accountability in Utah." />
  <link rel="canonical" href="https://utahciviccompact.org/statements" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://utahciviccompact.org/statements" />
  <meta property="og:title" content="Statements | Utah Civic Compact" />
  <meta property="og:description" content="Official statements from Utah Civic Compact on government transparency, consent, and civic accountability in Utah." />
  <meta property="og:image" content="https://utahciviccompact.org/UCC.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Statements | Utah Civic Compact" />
  <meta name="twitter:description" content="Official statements from Utah Civic Compact on government transparency, consent, and civic accountability in Utah." />
  <meta name="twitter:image" content="https://utahciviccompact.org/UCC.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/colors.css" />
  <link rel="stylesheet" href="/css/pages/statements.css" />
</head>
<body>

  <!-- NAVIGATION -->
{{> header}}

  <div class="subpage-hero">
    <div class="section-label">Official Statements</div>
    <h1>Statements</h1>
    <p>Where Utah Civic Compact stands, in our own words, on the record.</p>
  </div>

  <div class="statements-section">
    <div class="statements-inner">

      {{#statements}}
      <article class="statement-article" id="{{slug}}">
        <div class="statement-meta">{{date}} &nbsp;·&nbsp; {{topic}}</div>
        <h2 class="statement-title">{{title}}</h2>
        <div class="statement-byline">By {{author}}</div>
        <div class="statement-body">{{{body}}}</div>
        <div class="statement-signoff">{{signoff}}</div>
      </article>
      {{/statements}}

    </div>
  </div>

  <!-- FOOTER -->
{{> footer}}

  <script src="/js/main.js"></script>
</body>
</html>
