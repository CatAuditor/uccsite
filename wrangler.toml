name = "uccsite"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-01"

[[d1_databases]]
binding = "DB"
database_name = "ucc-members"
database_id = "c4987505-948e-4fd2-a819-262a3f8172e1"

[vars]
# Non-secret runtime config. Override in the Pages dashboard per environment.
DONATION_GOAL_CENTS = "100000"

# Secrets — set with `wrangler pages secret put <NAME>` (never commit values):
#   STRIPE_SECRET_KEY      Stripe API key (checkout + billing portal)
#   STRIPE_WEBHOOK_SECRET  Stripe webhook signing secret (/api/webhook)
#   AIRTABLE_TOKEN         Airtable PAT for the tipline base (/api/tip)
#   RESEND_API_KEY         Resend key for welcome + portal-link emails
#   TOKEN_SECRET           HMAC secret for portal magic links and unsubscribe links
#                          (also needed by scripts/send-periodical.js in .env)
